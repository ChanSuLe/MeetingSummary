<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetingSummary - AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎙️ MeetingSummary</h1>
            <p>AI Meeting Assistant (Browser-Based)</p>
        </header>

        <!-- Section Recording -->
        <section class="card">
            <h2>Live Recording</h2>
            <div id="timer-display" class="timer">00:00</div>
            
            <div class="controls">
                <button id="btn-record" class="btn primary">🔴 Record</button>
                <button id="btn-pause" class="btn secondary" disabled>⏸ Pause</button>
                <button id="btn-resume" class="btn secondary" style="display:none;">▶ Resume</button>
                <button id="btn-stop" class="btn danger" disabled>⏹ Stop</button>
            </div>
            <div id="record-status" class="status-text"></div>
        </section>

        <!-- Section Upload & Playback -->
        <section class="card">
            <h2>Audio Source</h2>
            <label for="audio-upload" class="upload-btn">📂 Upload Recording</label>
            <input type="file" id="audio-upload" accept="audio/*,video/mp4" style="display: none;">
            
            <!-- Audio Player -->
            <div id="player-container" style="display:none; margin-top: 15px;">
                <audio id="audio-player" controls style="width: 100%;"></audio>
                <button id="btn-transcribe" class="btn primary" style="margin-top: 10px; width: 100%;">✨ Transcribe to Text</button>
            </div>
            
            <div id="upload-status" class="status-text"></div>
        </section>

        <!-- Section Result -->
        <section class="card result-area">
            <h2>Transcription Result (ID/EN/ZH)</h2>
            <div id="transcript-output" class="transcript-box">Waiting for audio...</div>
        </section>
    </div>

    <!-- Load Whisper WASM Library via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@3.0.0/dist/transformers.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
