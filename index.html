<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MeetingSummary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎙️ MeetingSummary</h1>
            <p>AI Assistant (Zero-Cost & Private)</p>
        </header>

        <section class="card">
            <h2>Live Recording</h2>
            <div id="timer-display" class="timer">00:00</div>
            <div class="controls">
                <button id="btn-record" class="btn primary">🔴 Record</button>
                <button id="btn-pause" class="btn secondary" disabled>⏸ Pause</button>
                <button id="btn-resume" class="btn secondary" style="display:none;">▶ Resume</button>
                <button id="btn-stop" class="btn danger" disabled>⏹ Stop</button>
            </div>
            <div id="record-status" class="status-text"></div>
        </section>

        <section class="card" id="player-section" style="display:none;">
            <h2>Audio Preview</h2>
            <audio id="audio-player" controls style="width: 100%; margin-bottom: 15px;"></audio>
            <button id="btn-transcribe" class="btn primary full-width">✨ Transcribe to Text (ID/EN/ZH)</button>
            <div id="transcribe-status" class="status-text" style="margin-top:10px;"></div>
        </section>

        <section class="card">
            <h2>Or Upload File</h2>
            <label for="audio-upload" class="upload-btn">📂 Choose Audio File</label>
            <input type="file" id="audio-upload" accept="audio/*" style="display: none;">
        </section>

        <section class="card result-area">
            <h2>Transcription Result</h2>
            <div id="transcript-output" class="transcript-box">Waiting for audio...</div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
