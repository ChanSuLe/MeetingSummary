<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- ⚠️ WAJIB: Header ini mengaktifkan SharedArrayBuffer di GitHub Pages -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
    
    <title>Transkripsi Audio Harian</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎙️ Transkripsi Cepat</h1>
        
        <!-- Status Loading Model -->
        <div id="model-status" class="status-box loading">
            ⏳ Memuat mesin AI... (mohon tunggu 30-60 detik pertama kali)
        </div>

        <!-- Kontrol Rekaman -->
        <div class="recorder-controls">
            <button id="btn-record" disabled> Rekam</button>
            <button id="btn-stop" disabled> Stop</button>
        </div>

        <div id="timer">00:00</div>
        <p id="record-info">Tekan Rekam untuk mulai</p>

        <!-- Preview Audio -->
        <audio id="audio-preview" controls style="display:none; width:100%; margin-top:15px;"></audio>

        <!-- Tombol Transkripsi -->
        <button id="btn-transcribe" disabled style="margin-top:20px;">
            ✨ Transkrip ke Teks (ID/EN/ZH)
        </button>

        <!-- Hasil -->
        <div id="result-box" class="result-box" style="display:none;">
            <h3>Hasil Transkripsi:</h3>
            <p id="transcript-text"></p>
            <button id="btn-copy" style="margin-top:10px; font-size:14px;">📋 Salin Teks</button>
        </div>
    </div>

    <!-- Gunakan Xenova Transformers via CDN (lebih stabil di GH Pages) -->
    <script type="module" src="app.js"></script>
</body>
</html>
