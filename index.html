<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetingSummary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="recorder-container">
        <!-- Timer Display -->
        <div id="timer-display" class="timer">00:00</div>
        
        <!-- Controls -->
        <div class="controls">
            <button id="btn-record">🔴 Record</button>
            <button id="btn-pause" disabled> Pause</button>
            <button id="btn-resume" disabled style="display:none;">▶ Resume</button>
            <button id="btn-stop" disabled>⏹ Stop</button>
        </div>
        
        <!-- Status / Debug Info (Opsional untuk testing) -->
        <div id="status-log" class="log"></div>
    </div>

    <!-- PENTING: Gunakan type="module" -->
    <script type="module" src="app.js"></script>
</body>
</html>
